<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>War Zone</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/dashboard.css">
  <script src="/static/vendor/socket.io.min.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <h1 class="brand">WAR ZONE <small>cyber range</small></h1>
      <div class="status">
        <span><span id="conn-dot" class="dot off"></span><span id="conn-text">connecting</span></span>
        <span>SLA <b id="uptime" class="tnum">100.0%</b></span>
      </div>
    </header>

    <section class="score">
      <div class="team red">
        <div class="who"><b>Red</b> attacker</div>
        <div class="pts tnum" id="score-red">0</div>
      </div>
      <div class="spine">
        <div class="meter">
          <div class="m-red" id="bar-red" style="width:50%"></div>
          <div class="m-blue" id="bar-blue" style="width:50%"></div>
        </div>
        <div class="readout"><span>attack</span><span>defence</span></div>
        <div class="flag">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 22V4M4 4l9 4-9 4"/>
          </svg>
          flag <b id="flag-state">live</b>, rotates on a timer
        </div>
      </div>
      <div class="team blue">
        <div class="who"><b>Blue</b> defender</div>
        <div class="pts tnum" id="score-blue">0</div>
      </div>
    </section>

    <section class="cols">
      <div class="col">
        <h2>Attack surface</h2>
        <div id="vector-tally"></div>
      </div>
      <div class="col">
        <h2>Defences</h2>
        <div id="mitigations"></div>
      </div>
    </section>

    <section class="logwrap">
      <div class="loghead">
        <h2>Event log</h2>
        <div class="tech" id="attack"></div>
      </div>
      <ol id="feed"></ol>
    </section>
  </div>

  <script src="/static/dashboard.js"></script>
</body>
</html>
